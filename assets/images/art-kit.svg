<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="palWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="#fdf4ff"/>

  <!-- Wooden Artist Color Palette -->
  <g transform="translate(140, 100)">
    <!-- Kidney-shaped palette -->
    <path d="M50 120 C20 40, 140 10, 240 40 C320 60, 310 180, 230 190 C180 200, 190 140, 150 140 C120 140, 110 180, 70 160 Z" fill="url(#palWood)" stroke="#ea580c" stroke-width="2.5"/>
    <!-- Thumb hole -->
    <ellipse cx="140" cy="155" rx="14" ry="18" fill="#fdf4ff" stroke="#c2410c" stroke-width="2"/>

    <!-- Blobs of vibrant acrylic paint -->
    <circle cx="80" cy="80" r="14" fill="#ef4444"/>
    <circle cx="120" cy="50" r="14" fill="#f59e0b"/>
    <circle cx="170" cy="45" r="14" fill="#eab308"/>
    <circle cx="220" cy="65" r="14" fill="#22c55e"/>
    <circle cx="260" cy="105" r="14" fill="#3b82f6"/>
    <circle cx="250" cy="155" r="14" fill="#a855f7"/>
  </g>

  <!-- Wooden Paint Brushes -->
  <g transform="translate(320, 90) rotate(35)">
    <!-- Brush 1 -->
    <rect x="0" y="0" width="8" height="190" rx="3" fill="#b45309"/>
    <rect x="-1" y="160" width="10" height="20" fill="#94a3b8"/>
    <polygon points="-1,180 4,210 9,180" fill="#1e293b"/>
    <polygon points="1,200 4,210 7,200" fill="#3b82f6"/>
  </g>
  <g transform="translate(360, 110) rotate(45)">
    <!-- Brush 2 Flat -->
    <rect x="0" y="0" width="14" height="180" rx="4" fill="#78350f"/>
    <rect x="-1" y="150" width="16" height="20" fill="#94a3b8"/>
    <rect x="0" y="170" width="14" height="25" fill="#f97316"/>
  </g>

  <!-- Acrylic Paint Tube -->
  <g transform="translate(80, 220) rotate(-20)">
    <polygon points="0,0 35,5 30,70 5,70" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="10" y="-12" width="15" height="12" rx="2" fill="#1e293b"/>
    <text x="18" y="45" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">BLUE</text>
  </g>

  <text x="48" y="44" fill="#86198f" font-size="16" font-family="system-ui, sans-serif" font-weight="800">FINE ARTS &amp; DESIGN KIT</text>
  <text x="320" y="44" fill="#c026d3" font-size="12" font-family="system-ui, sans-serif">Acrylic Paints, Palette, Brushes &amp; Canvas</text>
</svg>
