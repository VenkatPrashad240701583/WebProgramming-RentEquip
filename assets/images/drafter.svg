<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="armSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="#f1f5f9"/>

  <!-- Mini-Drafter Base Clamp on Top Left Board Edge -->
  <g transform="translate(100, 70)">
    <rect x="0" y="0" width="45" height="55" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="22" cy="25" r="14" fill="#64748b"/>
    <line x1="8" y1="25" x2="36" y2="25" stroke="#f8fafc" stroke-width="3"/>
    <!-- Clamp Wing Screw Knob -->
    <rect x="-15" y="15" width="15" height="20" rx="3" fill="#f59e0b"/>

    <!-- Upper Parallel Parallelogram Linkage Arms -->
    <line x1="22" y1="25" x2="160" y2="80" stroke="url(#armSteel)" stroke-width="8" stroke-linecap="round"/>
    <line x1="32" y1="15" x2="170" y2="70" stroke="url(#armSteel)" stroke-width="8" stroke-linecap="round"/>
    <!-- Pivot Knuckle 1 -->
    <circle cx="165" cy="75" r="12" fill="#0f172a"/>
    <circle cx="165" cy="75" r="5" fill="#f8fafc"/>

    <!-- Lower Linkage Arms -->
    <line x1="165" y1="75" x2="270" y2="180" stroke="url(#armSteel)" stroke-width="8" stroke-linecap="round"/>
    <line x1="175" y1="65" x2="280" y2="170" stroke="url(#armSteel)" stroke-width="8" stroke-linecap="round"/>

    <!-- Protractor Circular Head -->
    <circle cx="275" cy="175" r="35" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="275" cy="175" r="24" fill="#1e293b"/>
    <circle cx="275" cy="175" r="12" fill="#f59e0b"/>
    <!-- Protractor Angle Degree Markings -->
    <path d="M250 175 H300 M275 150 V200" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- L-Shaped Orthogonal Scales (Transparent Acrylic with Millimeter Graduations) -->
    <!-- Horizontal Scale Arm -->
    <rect x="275" y="165" width="160" height="22" rx="2" fill="rgba(255,255,255,0.85)" stroke="#0284c7" stroke-width="2"/>
    <path d="M290 165 V175 M310 165 V172 M330 165 V175 M350 165 V172 M370 165 V175 M390 165 V172 M410 165 V175" stroke="#0284c7" stroke-width="1.5"/>
    <text x="350" y="182" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0369a1">150mm</text>

    <!-- Vertical Scale Arm (90 degrees perpendicular) -->
    <rect x="264" y="175" width="22" height="150" rx="2" fill="rgba(255,255,255,0.85)" stroke="#0284c7" stroke-width="2"/>
    <path d="M264 195 H274 M264 215 H271 M264 235 H274 M264 255 H271 M264 275 H274 M264 295 H271 M264 315 H274" stroke="#0284c7" stroke-width="1.5"/>
    <text x="270" y="260" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#0369a1" transform="rotate(90 270 260)">150mm</text>
  </g>

  <!-- French Curve Accessory beside drafter -->
  <g transform="translate(420, 240) scale(0.85)">
    <path d="M10,80 C30,10 90,20 100,60 C110,100 80,120 40,110 C0,100 0,90 10,80 Z" fill="rgba(56,189,248,0.3)" stroke="#0284c7" stroke-width="2"/>
    <circle cx="60" cy="70" r="10" fill="#f1f5f9" stroke="#0284c7" stroke-width="1.5"/>
  </g>

  <text x="48" y="44" fill="#0f172a" font-size="16" font-family="system-ui, sans-serif" font-weight="800">TECHNICAL MINI-DRAFTER</text>
  <text x="340" y="44" fill="#0284c7" font-size="12" font-family="system-ui, sans-serif">With 360° Locking Protractor Head</text>
</svg>
