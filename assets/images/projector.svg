<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="projLens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="projRay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="#f8fafc"/>

  <!-- Light Beam coming from Lens -->
  <polygon points="265,185 520,110 520,260" fill="url(#projRay)"/>

  <!-- Projector Unit (Compact Tabletop Presentation Projector) -->
  <g transform="translate(100, 140)">
    <!-- Main Body Chassis -->
    <rect x="0" y="20" width="180" height="75" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
    <!-- Ventilation grill slots on side -->
    <line x1="20" y1="40" x2="50" y2="40" stroke="#94a3b8" stroke-width="2"/>
    <line x1="20" y1="50" x2="50" y2="50" stroke="#94a3b8" stroke-width="2"/>
    <line x1="20" y1="60" x2="50" y2="60" stroke="#94a3b8" stroke-width="2"/>
    <line x1="20" y1="70" x2="50" y2="70" stroke="#94a3b8" stroke-width="2"/>

    <!-- Large Lens Housing on Right -->
    <circle cx="140" cy="50" r="28" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
    <circle cx="140" cy="50" r="20" fill="url(#projLens)"/>
    <circle cx="134" cy="44" r="6" fill="#ffffff" opacity="0.7"/>

    <!-- Top Control Buttons -->
    <circle cx="80" cy="30" r="4" fill="#0284c7"/>
    <circle cx="95" cy="30" r="4" fill="#64748b"/>
    <circle cx="110" cy="30" r="4" fill="#64748b"/>

    <!-- Rubber Feet -->
    <rect x="15" y="95" width="20" height="8" rx="3" fill="#334155"/>
    <rect x="145" y="95" width="20" height="8" rx="3" fill="#334155"/>
  </g>

  <!-- Wireless Presentation Laser Clicker -->
  <g transform="translate(360, 260) rotate(-15)">
    <rect x="0" y="0" width="100" height="26" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="20" cy="13" r="5" fill="#ef4444"/>
    <circle cx="45" cy="13" r="5" fill="#64748b"/>
    <circle cx="70" cy="13" r="5" fill="#64748b"/>
    <!-- Red Laser Pointer Beam -->
    <line x1="-1" y1="13" x2="-60" y2="13" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <text x="48" y="44" fill="#0f172a" font-size="16" font-family="system-ui, sans-serif" font-weight="800">HDMI PRESENTATION PROJECTOR</text>
  <text x="360" y="44" fill="#0284c7" font-size="12" font-family="system-ui, sans-serif">1080p FHD + Wireless Laser Clicker</text>
</svg>
