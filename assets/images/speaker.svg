<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="speakerCone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="#f8fafc"/>

  <!-- Portable Bluetooth Event Speaker Unit -->
  <g transform="translate(190, 70)">
    <!-- Main Cabinet Tower -->
    <rect x="30" y="0" width="150" height="260" rx="16" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    
    <!-- Top Carry Handle -->
    <path d="M60 0 C60 -20, 150 -20, 150 0" stroke="#f59e0b" stroke-width="8" fill="none"/>

    <!-- Dual Woofer Speaker Cones with RGB Light Rings -->
    <!-- Top Woofer -->
    <circle cx="105" cy="70" r="45" fill="#0f172a" stroke="#ec4899" stroke-width="4"/>
    <circle cx="105" cy="70" r="32" fill="url(#speakerCone)"/>
    <circle cx="105" cy="70" r="12" fill="#0f172a"/>

    <!-- Bottom Woofer -->
    <circle cx="105" cy="180" r="45" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="105" cy="180" r="32" fill="url(#speakerCone)"/>
    <circle cx="105" cy="180" r="12" fill="#0f172a"/>

    <!-- Volume Rotary Knob on Top -->
    <rect x="90" y="5" width="30" height="10" rx="3" fill="#f59e0b"/>
  </g>

  <!-- Wireless Handheld Mic alongside speaker -->
  <g transform="translate(400, 120) rotate(15)">
    <!-- Mesh Grille Capsule -->
    <circle cx="20" cy="20" r="18" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <path d="M5 20 H35 M20 5 V35" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Handle -->
    <rect x="11" y="38" width="18" height="120" rx="4" fill="#0f172a"/>
    <rect x="16" y="80" width="8" height="15" rx="2" fill="#ef4444"/>
  </g>

  <text x="48" y="44" fill="#0f172a" font-size="16" font-family="system-ui, sans-serif" font-weight="800">CAMPUS EVENT BLUETOOTH SPEAKER</text>
  <text x="340" y="44" fill="#0284c7" font-size="12" font-family="system-ui, sans-serif">100W Portable PA + Wireless Collar / Hand Mic</text>
</svg>
