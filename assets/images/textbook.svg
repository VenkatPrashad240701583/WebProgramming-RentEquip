<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bookBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="bookRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="#fefce8"/>

  <!-- Stack of Hardbound Textbooks -->
  <g transform="translate(150, 90)">
    <!-- Bottom Book (Blue Engineering Mathematics) -->
    <rect x="0" y="160" width="300" height="55" rx="5" fill="url(#bookBlue)" stroke="#1e3a8a" stroke-width="2"/>
    <rect x="20" y="166" width="270" height="43" fill="#f8fafc"/>
    <!-- Page lines pattern -->
    <line x1="290" y1="166" x2="290" y2="209" stroke="#cbd5e1" stroke-width="10"/>
    <text x="35" y="194" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">HIGHER ENGINEERING MATHEMATICS</text>

    <!-- Middle Book (Green Data Structures & Algorithms) -->
    <rect x="15" y="100" width="275" height="50" rx="5" fill="#065f46" stroke="#047857" stroke-width="2"/>
    <rect x="35" y="105" width="245" height="40" fill="#f8fafc"/>
    <line x1="280" y1="105" x2="280" y2="145" stroke="#cbd5e1" stroke-width="10"/>
    <text x="50" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">DATA STRUCTURES &amp; ALGORITHMS</text>

    <!-- Top Book (Red - Slanted with yellow post-it tabs) -->
    <g transform="rotate(-6 140 60)">
      <rect x="10" y="40" width="270" height="48" rx="5" fill="url(#bookRed)" stroke="#991b1b" stroke-width="2"/>
      <rect x="30" y="45" width="240" height="38" fill="#f8fafc"/>
      <line x1="270" y1="45" x2="270" y2="83" stroke="#cbd5e1" stroke-width="10"/>
      <text x="45" y="69" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">GATE CSE • EXAM PREPARATION</text>
      <!-- Post-it index sticky flags sticking out -->
      <rect x="180" y="32" width="20" height="12" rx="2" fill="#facc15"/>
      <rect x="210" y="32" width="20" height="12" rx="2" fill="#38bdf8"/>
      <rect x="240" y="32" width="20" height="12" rx="2" fill="#4ade80"/>
    </g>

    <!-- Ribbon bookmark hanging down -->
    <path d="M70 40 C70 90, 50 140, 60 230" stroke="#f59e0b" stroke-width="4" fill="none"/>
  </g>

  <text x="48" y="44" fill="#854d0e" font-size="16" font-family="system-ui, sans-serif" font-weight="800">ACADEMIC TEXTBOOKS &amp; MANUALS</text>
  <text x="360" y="44" fill="#a16207" font-size="12" font-family="system-ui, sans-serif">Standard Semester Syllabi + GATE/GRE Guides</text>
</svg>
