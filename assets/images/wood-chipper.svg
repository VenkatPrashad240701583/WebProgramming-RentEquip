<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="0" y="340" width="600" height="60" fill="#090d16"/>
  <!-- Trailer Base & Wheels -->
  <rect x="180" y="280" width="230" height="30" rx="4" fill="#334155"/>
  <circle cx="290" cy="315" r="30" fill="#1e293b" stroke="#475569" stroke-width="6"/>
  <circle cx="290" cy="315" r="12" fill="#cbd5e1"/>
  <!-- Tow hitch -->
  <polygon points="180,290 100,320 110,330 180,305" fill="#475569"/>
  <!-- Main Drum Housing & Engine -->
  <rect x="230" y="190" width="130" height="90" rx="6" fill="url(#yellow)"/>
  <!-- Infeed Hopper / Chute -->
  <polygon points="360,230 470,180 470,290 360,270" fill="#ca8a04" stroke="#854d0e" stroke-width="2"/>
  <!-- Discharge Chute pointing up and forward -->
  <path d="M260 190 L260 110 L200 90 L200 120 L240 130 L240 190 Z" fill="#eab308" stroke="#a16207" stroke-width="2"/>
  <rect x="190" y="85" width="20" height="35" rx="3" fill="#334155"/>
  <!-- Safety Stop Bar around hopper -->
  <rect x="465" y="175" width="12" height="120" rx="4" fill="#ef4444"/>
  <!-- Title -->
  <text x="50" y="60" fill="#f8fafc" font-size="20" font-family="system-ui, sans-serif" font-weight="700">Vermeer BC1000XL Wood Chipper</text>
  <text x="50" y="85" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">12&quot; Chipping Capacity • 89 HP Gas • SmartFeed System</text>
</svg>
