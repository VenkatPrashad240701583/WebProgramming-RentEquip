<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="meterYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="#fffbeb"/>

  <!-- Multimeter Body (Handheld Digital DMM) -->
  <g transform="translate(160, 60)">
    <!-- Shockproof Rubber Holster (Yellow/Black) -->
    <rect x="0" y="0" width="160" height="270" rx="24" fill="url(#meterYellow)" stroke="#b45309" stroke-width="3"/>
    <rect x="10" y="10" width="140" height="250" rx="18" fill="#1e293b"/>

    <!-- LCD Backlit Screen -->
    <rect x="25" y="25" width="110" height="55" rx="6" fill="#84cc16" stroke="#4d7c0f" stroke-width="2"/>
    <text x="80" y="62" font-family="monospace, monospace" font-size="28" font-weight="bold" fill="#14532d" text-anchor="middle">5.03 V</text>
    <text x="125" y="40" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#14532d">DC</text>

    <!-- Rotary Range Selector Dial -->
    <circle cx="80" cy="140" r="42" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <circle cx="80" cy="140" r="32" fill="#334155"/>
    <!-- Knob pointer line -->
    <rect x="77" y="105" width="6" height="35" rx="2" fill="#f59e0b"/>

    <!-- Dial Range Labels around knob -->
    <text x="80" y="94" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">V~</text>
    <text x="126" y="130" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#f59e0b">V=</text>
    <text x="124" y="165" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#a78bfa">Ω</text>
    <text x="40" y="155" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#f43f5e">A=</text>

    <!-- Banana Input Terminals (10A, COM, V-Ohm-mA) -->
    <circle cx="45" cy="225" r="10" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="80" cy="225" r="10" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="115" cy="225" r="10" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="80" cy="225" r="5" fill="#1e293b"/>
    <text x="80" y="248" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#94a3b8" text-anchor="middle">COM</text>
  </g>

  <!-- Probes and Test Leads (Red Probe and Black Probe) -->
  <g transform="translate(340, 150)">
    <!-- Black Probe Cable & Handle -->
    <path d="M-60 135 C-30 180, 20 200, 50 160" stroke="#0f172a" stroke-width="5" fill="none"/>
    <rect x="50" y="145" width="80" height="14" rx="3" fill="#1e293b" transform="rotate(-30 50 145)"/>
    <line x1="125" y1="105" x2="155" y2="90" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Red Probe Cable & Handle -->
    <path d="M-25 135 C0 190, 60 170, 70 90" stroke="#ef4444" stroke-width="5" fill="none"/>
    <rect x="70" y="80" width="80" height="14" rx="3" fill="#dc2626" transform="rotate(-55 70 80)"/>
    <line x1="120" y1="10" x2="145" y2="-10" stroke="#cbd5e1" stroke-width="3"/>
  </g>

  <text x="48" y="44" fill="#9a3412" font-size="16" font-family="system-ui, sans-serif" font-weight="800">DIGITAL MULTIMETER (DMM)</text>
  <text x="320" y="44" fill="#d97706" font-size="12" font-family="system-ui, sans-serif">Auto-Ranging with Test Probes &amp; Continuity</text>
</svg>
