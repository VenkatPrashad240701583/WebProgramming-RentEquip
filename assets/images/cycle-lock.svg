<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="shackleMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="#fefce8"/>

  <!-- Heavy Duty Campus Bicycle U-Lock -->
  <g transform="translate(170, 70)">
    <!-- Hardened Steel U-Shackle -->
    <path d="M40,190 V80 C40,10, 200,10, 200,80 V190" stroke="url(#shackleMetal)" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M40,190 V80 C40,10, 200,10, 200,80 V190" stroke="#f59e0b" stroke-width="28" stroke-dasharray="25 60" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Crossbar Locking Cylinder Base -->
    <rect x="10" y="180" width="220" height="50" rx="12" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    
    <!-- Combination Dials (4 Digit Roller Number Wheels) -->
    <g transform="translate(60, 192)">
      <!-- Dial 1 -->
      <rect x="0" y="0" width="24" height="26" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="12" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <!-- Dial 2 -->
      <rect x="30" y="0" width="24" height="26" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="42" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">0</text>
      <!-- Dial 3 -->
      <rect x="60" y="0" width="24" height="26" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="72" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
      <!-- Dial 4 -->
      <rect x="90" y="0" width="24" height="26" rx="4" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="102" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    </g>
  </g>

  <text x="48" y="44" fill="#713f12" font-size="16" font-family="system-ui, sans-serif" font-weight="800">CAMPUS BICYCLE U-LOCK</text>
  <text x="330" y="44" fill="#ca8a04" font-size="12" font-family="system-ui, sans-serif">Resettable 4-Digit Combination + 16mm Shackle</text>
</svg>
