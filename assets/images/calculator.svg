<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="calcBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="#f8fafc"/>

  <!-- Casio fx-991EX Style Scientific Calculator -->
  <g transform="translate(190, 45)">
    <!-- Main Enclosure Body -->
    <rect x="0" y="0" width="220" height="315" rx="20" fill="url(#calcBody)" stroke="#334155" stroke-width="3"/>

    <!-- High-Resolution Natural Textbook Display LCD -->
    <rect x="18" y="22" width="184" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <!-- Small Solar Panel Cell -->
    <rect x="145" y="8" width="55" height="10" rx="2" fill="#713f12" stroke="#451a03" stroke-width="1"/>
    <!-- Display Formula Math and Result -->
    <text x="26" y="44" font-family="monospace, monospace" font-size="12" fill="#334155">∫₀^π sin(x) dx</text>
    <text x="190" y="72" font-family="monospace, monospace" font-size="18" font-weight="bold" fill="#0f172a" text-anchor="end">2</text>

    <!-- Function Key Matrix (Shift, Alpha, Direction Pad, Mode) -->
    <!-- Circular D-Pad in center -->
    <ellipse cx="110" cy="105" rx="28" ry="14" fill="#334155" stroke="#475569" stroke-width="2"/>
    <circle cx="110" cy="105" r="7" fill="#1e293b"/>
    <!-- Shift & Alpha keys -->
    <rect x="25" y="95" width="26" height="15" rx="3" fill="#ca8a04"/>
    <text x="38" y="106" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">SHIFT</text>
    <rect x="58" y="95" width="26" height="15" rx="3" fill="#dc2626"/>
    <text x="71" y="106" font-family="system-ui, sans-serif" font-weight="bold" font-size="7" fill="#ffffff" text-anchor="middle">ALPHA</text>
    <!-- Mode / On keys -->
    <rect x="138" y="95" width="26" height="15" rx="3" fill="#475569"/>
    <rect x="168" y="95" width="26" height="15" rx="3" fill="#475569"/>
    <text x="181" y="106" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">ON</text>

    <!-- Scientific Function Rows (sin, cos, tan, log, ln, x^2, x^y) -->
    <g transform="translate(25, 125)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="30" height="15" rx="3" fill="#334155"/><text x="15" y="11" font-size="8" fill="#e2e8f0" text-anchor="middle">x⁻¹</text>
      <rect x="35" y="0" width="30" height="15" rx="3" fill="#334155"/><text x="50" y="11" font-size="8" fill="#e2e8f0" text-anchor="middle">√■</text>
      <rect x="70" y="0" width="30" height="15" rx="3" fill="#334155"/><text x="85" y="11" font-size="8" fill="#e2e8f0" text-anchor="middle">x²</text>
      <rect x="105" y="0" width="30" height="15" rx="3" fill="#334155"/><text x="120" y="11" font-size="8" fill="#e2e8f0" text-anchor="middle">^</text>
      <rect x="140" y="0" width="30" height="15" rx="3" fill="#334155"/><text x="155" y="11" font-size="8" fill="#e2e8f0" text-anchor="middle">log</text>

      <!-- Row 2 -->
      <rect x="0" y="20" width="30" height="15" rx="3" fill="#334155"/><text x="15" y="31" font-size="8" fill="#e2e8f0" text-anchor="middle">ln</text>
      <rect x="35" y="20" width="30" height="15" rx="3" fill="#334155"/><text x="50" y="31" font-size="8" fill="#e2e8f0" text-anchor="middle">(-)</text>
      <rect x="70" y="20" width="30" height="15" rx="3" fill="#334155"/><text x="85" y="31" font-size="8" fill="#e2e8f0" text-anchor="middle">sin</text>
      <rect x="105" y="20" width="30" height="15" rx="3" fill="#334155"/><text x="120" y="31" font-size="8" fill="#e2e8f0" text-anchor="middle">cos</text>
      <rect x="140" y="20" width="30" height="15" rx="3" fill="#334155"/><text x="155" y="31" font-size="8" fill="#e2e8f0" text-anchor="middle">tan</text>
    </g>

    <!-- Numeric Keypad Grid (7 8 9 DEL AC, 4 5 6 * /, 1 2 3 + -, 0 . x10^x Ans =) -->
    <g transform="translate(25, 175)">
      <!-- 7 8 9 DEL AC -->
      <rect x="0" y="0" width="30" height="20" rx="3" fill="#f8fafc"/><text x="15" y="14" font-weight="bold" font-size="11" fill="#0f172a" text-anchor="middle">7</text>
      <rect x="35" y="0" width="30" height="20" rx="3" fill="#f8fafc"/><text x="50" y="14" font-weight="bold" font-size="11" fill="#0f172a" text-anchor="middle">8</text>
      <rect x="70" y="0" width="30" height="20" rx="3" fill="#f8fafc"/><text x="85" y="14" font-weight="bold" font-size="11" fill="#0f172a" text-anchor="middle">9</text>
      <rect x="105" y="0" width="30" height="20" rx="3" fill="#ef4444"/><text x="120" y="14" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">DEL</text>
      <rect x="140" y="0" width="30" height="20" rx="3" fill="#ef4444"/><text x="155" y="14" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">AC</text>

      <!-- 4 5 6 * / -->
      <rect x="0" y="26" width="30" height="20" rx="3" fill="#f8fafc"/><text x="15" y="40" font-weight="bold" font-size="11" fill="#0f172a" text-anchor="middle">4</text>
      <rect x="35" y="26" width="30" height="20" rx="3" fill="#f8fafc"/><text x="50" y="40" font-weight="bold" font-size="11" fill="#0f172a" text-anchor="middle">5</text>
      <rect x="70" y="26" width="30" height="20" rx="3" fill="#f8fafc"/><text x="85" y="40" font-weight="bold" font-size="11" fill="#0f172a" text-anchor="middle">6</text>
      <rect x="105" y="26" width="30" height="20" rx="3" fill="#e2e8f0"/><text x="120" y="40" font-weight="bold" font-size="12" fill="#0f172a" text-anchor="middle">×</text>
      <rect x="140" y="26" width="30" height="20" rx="3" fill="#e2e8f0"/><text x="155" y="40" font-weight="bold" font-size="12" fill="#0f172a" text-anchor="middle">÷</text>

      <!-- 1 2 3 + - -->
      <rect x="0" y="52" width="30" height="20" rx="3" fill="#f8fafc"/><text x="15" y="66" font-weight="bold" font-size="11" fill="#0f172a" text-anchor="middle">1</text>
      <rect x="35" y="52" width="30" height="20" rx="3" fill="#f8fafc"/><text x="50" y="66" font-weight="bold" font-size="11" fill="#0f172a" text-anchor="middle">2</text>
      <rect x="70" y="52" width="30" height="20" rx="3" fill="#f8fafc"/><text x="85" y="66" font-weight="bold" font-size="11" fill="#0f172a" text-anchor="middle">3</text>
      <rect x="105" y="52" width="30" height="20" rx="3" fill="#e2e8f0"/><text x="120" y="66" font-weight="bold" font-size="12" fill="#0f172a" text-anchor="middle">+</text>
      <rect x="140" y="52" width="30" height="20" rx="3" fill="#e2e8f0"/><text x="155" y="66" font-weight="bold" font-size="12" fill="#0f172a" text-anchor="middle">−</text>

      <!-- 0 . x10 Ans = -->
      <rect x="0" y="78" width="30" height="20" rx="3" fill="#f8fafc"/><text x="15" y="92" font-weight="bold" font-size="11" fill="#0f172a" text-anchor="middle">0</text>
      <rect x="35" y="78" width="30" height="20" rx="3" fill="#f8fafc"/><text x="50" y="92" font-weight="bold" font-size="12" fill="#0f172a" text-anchor="middle">.</text>
      <rect x="70" y="78" width="30" height="20" rx="3" fill="#e2e8f0"/><text x="85" y="92" font-size="9" fill="#0f172a" text-anchor="middle">x10ˣ</text>
      <rect x="105" y="78" width="30" height="20" rx="3" fill="#e2e8f0"/><text x="120" y="92" font-size="9" fill="#0f172a" text-anchor="middle">Ans</text>
      <rect x="140" y="78" width="30" height="20" rx="3" fill="#3b82f6"/><text x="155" y="93" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">=</text>
    </g>
  </g>

  <text x="48" y="44" fill="#0f172a" font-size="16" font-family="system-ui, sans-serif" font-weight="800">SCIENTIFIC CALCULATOR</text>
  <text x="48" y="64" fill="#0284c7" font-size="12" font-family="system-ui, sans-serif">Casio fx-991EX ClassWiz • 552 Functions</text>
</svg>
