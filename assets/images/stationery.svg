<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="penBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pencilYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg)"/>
  <!-- Notebook grid paper pattern in background -->
  <path d="M0 80 H600 M0 140 H600 M0 200 H600 M0 260 H600 M0 320 H600" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="80" y1="0" x2="80" y2="400" stroke="#fca5a5" stroke-width="2" opacity="0.6"/>

  <!-- Ruler (Scale) 30cm -->
  <g transform="rotate(-15 300 230)">
    <rect x="140" y="260" width="340" height="48" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <!-- Ruler markings -->
    <path d="M160 260 V275 M180 260 V270 M200 260 V280 M220 260 V270 M240 260 V275 M260 260 V270 M280 260 V280 M300 260 V270 M320 260 V275 M340 260 V270 M360 260 V280 M380 260 V270 M400 260 V275 M420 260 V270 M440 260 V280 M460 260 V270" stroke="#475569" stroke-width="2"/>
    <text x="200" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#64748b">10</text>
    <text x="280" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#64748b">15</text>
    <text x="360" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#64748b">20</text>
    <text x="440" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#64748b">25</text>
  </g>

  <!-- Gel Pen -->
  <g transform="rotate(35 250 180)">
    <rect x="180" y="170" width="220" height="18" rx="4" fill="url(#penBlue)"/>
    <polygon points="400,170 425,179 400,188" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="425" cy="179" r="2.5" fill="#1e293b"/>
    <!-- Pen clip and cap line -->
    <rect x="200" y="165" width="45" height="4" rx="2" fill="#94a3b8"/>
    <line x1="250" y1="170" x2="250" y2="188" stroke="#93c5fd" stroke-width="2"/>
  </g>

  <!-- Wooden Pencil with Eraser -->
  <g transform="rotate(-40 330 190)">
    <rect x="210" y="180" width="230" height="16" fill="url(#pencilYellow)"/>
    <!-- Metal Ferrule and Eraser -->
    <rect x="195" y="178" width="15" height="20" fill="#94a3b8"/>
    <rect x="180" y="178" width="15" height="20" rx="3" fill="#f43f5e"/>
    <!-- Sharpened Lead Point -->
    <polygon points="440,180 470,188 440,196" fill="#fed7aa"/>
    <polygon points="460,185 470,188 460,191" fill="#1e293b"/>
  </g>

  <!-- Eraser Block & Sharpener -->
  <g transform="translate(380, 240)">
    <rect x="0" y="0" width="70" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="35" height="40" rx="6" fill="#0284c7"/>
    <text x="18" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">DUST</text>
    <text x="52" y="25" fill="#0284c7" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">FREE</text>
  </g>

  <!-- Header text -->
  <text x="48" y="52" fill="#065f46" font-size="18" font-family="system-ui, sans-serif" font-weight="800">CAMPUS ESSENTIALS</text>
  <text x="48" y="72" fill="#047857" font-size="12" font-family="system-ui, sans-serif">Daily Exam &amp; Class Stationery Pack</text>
</svg>
