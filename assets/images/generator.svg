<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="0" y="340" width="600" height="60" fill="#090d16"/>
  <!-- Trailer Chassis -->
  <rect x="150" y="275" width="280" height="25" rx="4" fill="#334155"/>
  <!-- Trailer Tongue & Hitch -->
  <polygon points="150,285 80,310 90,320 150,300" fill="#475569"/>
  <circle cx="80" cy="315" r="8" fill="#fbbf24"/>
  <!-- Jack Stand -->
  <rect x="120" y="295" width="10" height="45" fill="#64748b"/>
  <rect x="115" y="335" width="20" height="6" fill="#334155"/>
  <!-- Wheels -->
  <circle cx="310" cy="315" r="32" fill="#1e293b" stroke="#475569" stroke-width="7"/>
  <circle cx="310" cy="315" r="12" fill="#cbd5e1"/>
  <!-- Sound-Attenuated Enclosure -->
  <rect x="160" y="140" width="260" height="135" rx="10" fill="url(#green)"/>
  <!-- Air Louvers / Vents -->
  <rect x="180" y="165" width="45" height="85" rx="4" fill="#064e3b"/>
  <line x1="185" y1="180" x2="220" y2="180" stroke="#a7f3d0" stroke-width="2"/>
  <line x1="185" y1="195" x2="220" y2="195" stroke="#a7f3d0" stroke-width="2"/>
  <line x1="185" y1="210" x2="220" y2="210" stroke="#a7f3d0" stroke-width="2"/>
  <line x1="185" y1="225" x2="220" y2="225" stroke="#a7f3d0" stroke-width="2"/>
  <line x1="185" y1="240" x2="220" y2="240" stroke="#a7f3d0" stroke-width="2"/>
  <!-- Access Doors -->
  <rect x="240" y="155" width="165" height="105" rx="6" fill="#059669" stroke="#047857" stroke-width="3"/>
  <!-- Control Panel Window -->
  <rect x="330" y="165" width="60" height="40" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="345" cy="180" r="5" fill="#38bdf8"/>
  <circle cx="365" cy="180" r="5" fill="#ef4444"/>
  <circle cx="380" cy="180" r="3" fill="#22c55e"/>
  <!-- Exhaust Stack -->
  <rect x="375" y="110" width="22" height="30" rx="3" fill="#334155"/>
  <path d="M370 110 L402 110 L395 100 L377 100 Z" fill="#475569"/>
  <!-- Lifting Eye -->
  <path d="M280 140 C280 115, 305 115, 305 140" stroke="#f59e0b" stroke-width="8" fill="none"/>
  <!-- Brand text -->
  <text x="250" y="235" fill="#f8fafc" font-size="12" font-family="system-ui, sans-serif" font-weight="bold">GENERAC 70kVA</text>
  <text x="50" y="60" fill="#f8fafc" font-size="20" font-family="system-ui, sans-serif" font-weight="700">Generac 70kVA Diesel Generator</text>
  <text x="50" y="85" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Ultra-Quiet Towable • 3-Phase &amp; Single-Phase</text>
</svg>
