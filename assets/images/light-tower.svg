<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="0" y="340" width="600" height="60" fill="#090d16"/>
  <!-- Light Beam glow -->
  <polygon points="340,90 200,340 480,340" fill="url(#glow)"/>
  <!-- Trailer Base & Wheels -->
  <rect x="250" y="280" width="180" height="35" rx="4" fill="#334155"/>
  <polygon points="250,290 170,325 180,335 250,305" fill="#475569"/>
  <circle cx="170" cy="330" r="7" fill="#f59e0b"/>
  <circle cx="340" cy="315" r="28" fill="#1e293b" stroke="#475569" stroke-width="6"/>
  <circle cx="340" cy="315" r="10" fill="#cbd5e1"/>
  <!-- Generator cabinet -->
  <rect x="270" y="210" width="140" height="70" rx="6" fill="#f59e0b"/>
  <rect x="280" y="225" width="40" height="40" fill="#0f172a" rx="3"/>
  <!-- Mast Tower -->
  <rect x="330" y="80" width="18" height="130" fill="#64748b"/>
  <rect x="333" y="60" width="12" height="60" fill="#94a3b8"/>
  <!-- 4 LED Fixture Heads -->
  <rect x="300" y="55" width="25" height="18" rx="3" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
  <rect x="302" y="57" width="21" height="14" fill="#fef08a"/>
  <rect x="350" y="55" width="25" height="18" rx="3" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
  <rect x="352" y="57" width="21" height="14" fill="#fef08a"/>
  <text x="50" y="60" fill="#f8fafc" font-size="20" font-family="system-ui, sans-serif" font-weight="700">Generac Mobile LED Light Tower</text>
  <text x="50" y="85" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">4x 350W High-Efficiency LEDs • 23 ft Mast • Towable</text>
</svg>
