<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pcbTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="#f0f9ff"/>

  <!-- Arduino Uno R3 Development Board -->
  <g transform="translate(140, 80)">
    <!-- Blue/Teal PCB Substrate -->
    <rect x="0" y="0" width="310" height="220" rx="10" fill="url(#pcbTeal)" stroke="#075985" stroke-width="3"/>

    <!-- Mounting Holes -->
    <circle cx="20" cy="20" r="7" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="290" cy="20" r="7" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="290" cy="200" r="7" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="20" cy="200" r="7" fill="#f0f9ff" stroke="#cbd5e1" stroke-width="2"/>

    <!-- USB Type-B Metal Port -->
    <rect x="-12" y="30" width="45" height="40" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <rect x="-6" y="40" width="14" height="20" rx="2" fill="#1e293b"/>

    <!-- DC Barrel Power Jack -->
    <rect x="-12" y="140" width="45" height="48" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
    <circle cx="20" cy="164" r="7" fill="#64748b"/>

    <!-- ATmega328P Microcontroller DIP IC -->
    <rect x="130" y="130" width="120" height="40" rx="3" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- IC Pins -->
    <path d="M140 122 V130 M155 122 V130 M170 122 V130 M185 122 V130 M200 122 V130 M215 122 V130 M230 122 V130" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M140 170 V178 M155 170 V178 M170 170 V178 M185 170 V178 M200 170 V178 M215 170 V178 M230 170 V178" stroke="#cbd5e1" stroke-width="2"/>
    <text x="190" y="154" font-family="monospace, monospace" font-size="10" font-weight="bold" fill="#94a3b8" text-anchor="middle">ATmega328P</text>

    <!-- 16MHz Crystal Oscillator -->
    <ellipse cx="90" cy="115" rx="14" ry="7" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>

    <!-- Reset Pushbutton -->
    <rect x="25" y="85" width="22" height="22" rx="3" fill="#cbd5e1"/>
    <circle cx="36" cy="96" r="6" fill="#dc2626"/>

    <!-- Female Header Pin Sockets (Top Digital, Bottom Analog/Power) -->
    <!-- Top Digital Headers -->
    <rect x="80" y="8" width="115" height="18" rx="2" fill="#0f172a"/>
    <rect x="205" y="8" width="90" height="18" rx="2" fill="#0f172a"/>
    <!-- Bottom Power & Analog Headers -->
    <rect x="80" y="194" width="85" height="18" rx="2" fill="#0f172a"/>
    <rect x="175" y="194" width="70" height="18" rx="2" fill="#0f172a"/>

    <!-- Built-in LED & RX/TX LEDs -->
    <circle cx="110" cy="65" r="3.5" fill="#facc15"/>
    <circle cx="110" cy="78" r="3.5" fill="#22c55e"/>

    <!-- SilkScreen Branding -->
    <text x="160" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#f8fafc">ARDUINO</text>
    <text x="160" y="82" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#7dd3fc">UNO R3</text>
  </g>

  <text x="48" y="44" fill="#0369a1" font-size="16" font-family="system-ui, sans-serif" font-weight="800">ARDUINO / ESP32 PROTOTYPING KIT</text>
  <text x="360" y="44" fill="#0284c7" font-size="12" font-family="system-ui, sans-serif">With Jumper Wires &amp; Breadboard</text>
</svg>
