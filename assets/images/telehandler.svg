<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="0" y="340" width="600" height="60" fill="#090d16"/>
  <!-- Heavy Off-road Tires -->
  <circle cx="210" cy="300" r="42" fill="#1e293b" stroke="#334155" stroke-width="10"/>
  <circle cx="210" cy="300" r="16" fill="#fbbf24"/>
  <circle cx="360" cy="300" r="42" fill="#1e293b" stroke="#334155" stroke-width="10"/>
  <circle cx="360" cy="300" r="16" fill="#fbbf24"/>
  <!-- Chassis -->
  <rect x="170" y="260" width="230" height="35" rx="6" fill="#334155"/>
  <!-- Cab -->
  <path d="M220 260 L240 160 L310 160 L320 260 Z" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <path d="M245 170 L300 170 L310 250 L230 250 Z" fill="#38bdf8" opacity="0.6"/>
  <!-- Outrigger Stabilizers -->
  <polygon points="380,270 410,270 420,340 400,340" fill="#f59e0b"/>
  <!-- Telescopic Boom Arm -->
  <line x1="160" y1="230" x2="440" y2="150" stroke="url(#yellow)" stroke-width="26" stroke-linecap="round"/>
  <line x1="420" y1="155" x2="490" y2="135" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round"/>
  <!-- Fork Carriage & Tines -->
  <rect x="490" y="125" width="8" height="60" fill="#1e293b"/>
  <polygon points="490,185 550,185 550,178 490,178" fill="#334155"/>
  <!-- Counterweight -->
  <rect x="135" y="230" width="35" height="50" rx="4" fill="#0f172a"/>
  <!-- Title -->
  <text x="50" y="60" fill="#f8fafc" font-size="20" font-family="system-ui, sans-serif" font-weight="700">JLG 1055 Telehandler</text>
  <text x="50" y="85" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">10,000 lb Capacity • 55 ft Reach Reach-Forklift</text>
</svg>
