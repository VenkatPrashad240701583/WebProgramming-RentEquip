<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="0" y="340" width="600" height="60" fill="#090d16"/>
  <!-- Support A-Frame -->
  <line x1="200" y1="330" x2="280" y2="230" stroke="#475569" stroke-width="10"/>
  <line x1="360" y1="330" x2="280" y2="230" stroke="#475569" stroke-width="10"/>
  <line x1="220" y1="300" x2="340" y2="300" stroke="#475569" stroke-width="8"/>
  <!-- Wheels -->
  <circle cx="190" cy="330" r="28" fill="#1e293b" stroke="#64748b" stroke-width="6"/>
  <circle cx="190" cy="330" r="10" fill="#cbd5e1"/>
  <!-- Tow pole -->
  <line x1="360" y1="330" x2="450" y2="335" stroke="#475569" stroke-width="8"/>
  <circle cx="450" cy="335" r="6" fill="#f59e0b"/>
  <!-- Mixer Drum -->
  <g transform="rotate(-25 290 220)">
    <path d="M220 180 L340 180 L360 250 L200 250 Z" fill="url(#orange)"/>
    <ellipse cx="280" cy="180" rx="60" ry="20" fill="#9a3412"/>
    <ellipse cx="280" cy="250" rx="80" ry="35" fill="url(#orange)"/>
    <circle cx="280" cy="250" r="14" fill="#334155"/>
  </g>
  <!-- Handwheel / Dump wheel -->
  <circle cx="370" cy="210" r="24" fill="none" stroke="#f59e0b" stroke-width="5"/>
  <line x1="346" y1="210" x2="394" y2="210" stroke="#f59e0b" stroke-width="4"/>
  <line x1="370" y1="186" x2="370" y2="234" stroke="#f59e0b" stroke-width="4"/>
  <!-- Motor Housing -->
  <rect x="230" y="240" width="55" height="50" rx="4" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <rect x="235" y="245" width="20" height="40" fill="#0f172a"/>
  <!-- Header -->
  <text x="50" y="60" fill="#f8fafc" font-size="20" font-family="system-ui, sans-serif" font-weight="700">Multiquip 9 cu ft Concrete Mixer</text>
  <text x="50" y="85" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Honda Gas Engine • Steel Drum Towable</text>
</svg>
