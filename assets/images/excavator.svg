<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Grid overlay -->
  <path d="M0 320 L600 320 M0 360 L600 360" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <rect x="0" y="340" width="600" height="60" fill="#090d16"/>
  <!-- Tracks / Undercarriage -->
  <rect x="140" y="270" width="220" height="50" rx="25" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <circle cx="165" cy="295" r="18" fill="#334155"/>
  <circle cx="215" cy="295" r="14" fill="#334155"/>
  <circle cx="250" cy="295" r="14" fill="#334155"/>
  <circle cx="285" cy="295" r="14" fill="#334155"/>
  <circle cx="335" cy="295" r="18" fill="#334155"/>
  <!-- Track treads -->
  <path d="M140 295 H360" stroke="#0f172a" stroke-width="6" stroke-dasharray="10 8"/>
  <!-- Main Body / Revolving Frame -->
  <path d="M160 270 L170 210 L280 200 L320 220 L330 270 Z" fill="url(#yellow)"/>
  <!-- Counterweight -->
  <path d="M150 240 L170 210 L180 270 L155 270 Z" fill="#334155"/>
  <!-- Enclosed Cab -->
  <path d="M220 200 L240 130 L290 130 L305 200 Z" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <path d="M245 140 L285 140 L298 190 L232 190 Z" fill="#38bdf8" opacity="0.7"/>
  <!-- Boom / Arm / Bucket -->
  <path d="M300 230 L390 140 L450 170" stroke="url(#yellow)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="390" cy="140" r="8" fill="#0f172a"/>
  <!-- Stick / Dipper -->
  <path d="M450 170 L480 260" stroke="url(#yellow)" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="450" cy="170" r="7" fill="#0f172a"/>
  <circle cx="480" cy="260" r="7" fill="#0f172a"/>
  <!-- Hydraulic Cylinders -->
  <path d="M320 200 L370 145" stroke="url(#metal)" stroke-width="6"/>
  <path d="M410 150 L460 210" stroke="url(#metal)" stroke-width="5"/>
  <!-- Excavator Bucket -->
  <path d="M480 260 C520 265, 530 295, 490 315 C460 315, 460 290, 480 260 Z" fill="#334155" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="505,310 520,318 510,322" fill="#d97706"/>
  <polygon points="490,315 505,324 495,327" fill="#d97706"/>
  <!-- Decal / Brand Tag -->
  <rect x="200" y="235" width="70" height="15" rx="3" fill="#0f172a"/>
  <text x="235" y="246" fill="#fbbf24" font-size="9" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CAT 308 CR</text>
  <text x="50" y="60" fill="#f8fafc" font-size="20" font-family="system-ui, sans-serif" font-weight="700">RentEquip Heavy Duty</text>
  <text x="50" y="85" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Commercial Grade • Inspected &amp; Certified</text>
</svg>
