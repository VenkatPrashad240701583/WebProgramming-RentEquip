<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" rx="16" fill="#fefce8"/>

  <!-- Wooden Chessboard Inlay -->
  <g transform="translate(160, 90)">
    <!-- Board Border -->
    <rect x="0" y="0" width="280" height="210" rx="8" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <rect x="15" y="15" width="250" height="180" fill="#fef08a"/>

    <!-- Alternating Squares Pattern (8x6 visible) -->
    <g fill="#92400e">
      <rect x="15" y="15" width="31" height="30"/>
      <rect x="77" y="15" width="31" height="30"/>
      <rect x="139" y="15" width="31" height="30"/>
      <rect x="201" y="15" width="31" height="30"/>

      <rect x="46" y="45" width="31" height="30"/>
      <rect x="108" y="45" width="31" height="30"/>
      <rect x="170" y="45" width="31" height="30"/>
      <rect x="232" y="45" width="31" height="30"/>

      <rect x="15" y="75" width="31" height="30"/>
      <rect x="77" y="75" width="31" height="30"/>
      <rect x="139" y="75" width="31" height="30"/>
      <rect x="201" y="75" width="31" height="30"/>

      <rect x="46" y="105" width="31" height="30"/>
      <rect x="108" y="105" width="31" height="30"/>
      <rect x="170" y="105" width="31" height="30"/>
      <rect x="232" y="105" width="31" height="30"/>

      <rect x="15" y="135" width="31" height="30"/>
      <rect x="77" y="135" width="31" height="30"/>
      <rect x="139" y="135" width="31" height="30"/>
      <rect x="201" y="135" width="31" height="30"/>

      <rect x="46" y="165" width="31" height="30"/>
      <rect x="108" y="165" width="31" height="30"/>
      <rect x="170" y="165" width="31" height="30"/>
      <rect x="232" y="165" width="31" height="30"/>
    </g>

    <!-- Chess Knight & King Pieces on Board -->
    <!-- White Knight -->
    <path d="M125 150 C120 120, 140 100, 155 110 C160 115, 155 125, 150 125 C145 135, 150 145, 155 150 Z" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <rect x="122" y="150" width="36" height="8" rx="2" fill="#ffffff" stroke="#475569" stroke-width="2"/>

    <!-- Black King -->
    <path d="M215 150 L220 110 L230 110 L235 150 Z" fill="#1e293b"/>
    <circle cx="225" cy="105" r="8" fill="#1e293b"/>
    <!-- Cross on top -->
    <line x1="225" y1="92" x2="225" y2="100" stroke="#f59e0b" stroke-width="2"/>
    <line x1="222" y1="96" x2="228" y2="96" stroke="#f59e0b" stroke-width="2"/>
    <rect x="212" y="150" width="26" height="8" rx="2" fill="#0f172a"/>
  </g>

  <text x="48" y="44" fill="#78350f" font-size="16" font-family="system-ui, sans-serif" font-weight="800">TOURNAMENT WOODEN CHESS</text>
  <text x="340" y="44" fill="#a16207" font-size="12" font-family="system-ui, sans-serif">16" Folding Sheesham Board + Staunton Pieces</text>
</svg>
