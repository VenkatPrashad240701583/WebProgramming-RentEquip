<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="ballShade" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="#f0fdf4"/>

  <!-- Official Match Football (Size 5) -->
  <g transform="translate(210, 110)">
    <!-- Base Sphere -->
    <circle cx="90" cy="90" r="85" fill="url(#ballShade)" stroke="#0f172a" stroke-width="3"/>

    <!-- Black Hexagons / Pentagons Pattern -->
    <polygon points="90,65 110,80 102,105 78,105 70,80" fill="#0f172a"/>
    <!-- Radiating Seam lines -->
    <line x1="90" y1="65" x2="90" y2="35" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="110" y1="80" x2="135" y2="70" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="102" y1="105" x2="125" y2="125" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="78" y1="105" x2="55" y2="125" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="70" y1="80" x2="45" y2="70" stroke="#0f172a" stroke-width="2.5"/>

    <!-- Adjacent Patches -->
    <polygon points="90,35 65,25 50,45 70,80" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <polygon points="90,35 115,25 130,45 110,80" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <polygon points="135,70 155,75 160,105 125,125 102,105" fill="#0f172a"/>
    <polygon points="45,70 25,75 20,105 55,125 78,105" fill="#0f172a"/>
  </g>

  <text x="48" y="44" fill="#166534" font-size="16" font-family="system-ui, sans-serif" font-weight="800">CAMPUS MATCH FOOTBALL</text>
  <text x="340" y="44" fill="#15803d" font-size="12" font-family="system-ui, sans-serif">Size 5 All-Weather + Air Pump &amp; Needle</text>
</svg>
