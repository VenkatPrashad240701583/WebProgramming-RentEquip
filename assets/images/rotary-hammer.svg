<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="0" y="340" width="600" height="60" fill="#090d16"/>
  <!-- D-Handle and Main Body of Demo Hammer -->
  <path d="M140 220 C140 170, 180 170, 190 200 L210 200 L210 270 L190 270 C180 300, 140 300, 140 250 Z" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <rect x="160" y="225" width="15" height="40" rx="3" fill="#ef4444"/>
  <!-- Motor Housing -->
  <rect x="210" y="195" width="120" height="80" rx="6" fill="url(#teal)"/>
  <!-- Cooling Vents -->
  <line x1="220" y1="215" x2="250" y2="215" stroke="#0f172a" stroke-width="3"/>
  <line x1="220" y1="230" x2="250" y2="230" stroke="#0f172a" stroke-width="3"/>
  <line x1="220" y1="245" x2="250" y2="245" stroke="#0f172a" stroke-width="3"/>
  <!-- Mode Selector -->
  <circle cx="280" cy="225" r="14" fill="#1e293b"/>
  <rect x="278" y="215" width="4" height="12" fill="#f59e0b"/>
  <!-- Gearbox Barrel -->
  <polygon points="330,205 400,215 400,255 330,265" fill="#64748b"/>
  <!-- SDS-Max Chuck -->
  <rect x="400" y="220" width="45" height="30" rx="4" fill="#1e293b"/>
  <rect x="445" y="225" width="15" height="20" fill="#475569"/>
  <!-- Bull Point Chisel Bit -->
  <polygon points="460,230 540,230 560,235 540,240 460,240" fill="#cbd5e1"/>
  <!-- 360 Aux Side Handle -->
  <rect x="370" y="255" width="14" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="377" cy="255" r="12" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <!-- Title -->
  <text x="50" y="60" fill="#f8fafc" font-size="20" font-family="system-ui, sans-serif" font-weight="700">Bosch SDS-Max Demolition Hammer</text>
  <text x="50" y="85" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">15 Amp • 19 Ft-Lbs Impact Energy • Anti-Vibration</text>
</svg>
