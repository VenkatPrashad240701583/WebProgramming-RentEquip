<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="0" y="340" width="600" height="60" fill="#090d16"/>
  <!-- Cart Frame -->
  <path d="M220 330 L360 330 L380 200 L350 140 L310 140" stroke="#475569" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Wheels -->
  <circle cx="240" cy="320" r="30" fill="#1e293b" stroke="#64748b" stroke-width="6"/>
  <circle cx="240" cy="320" r="10" fill="#cbd5e1"/>
  <!-- Front bumper rubber foot -->
  <rect x="350" y="330" width="20" height="15" rx="3" fill="#0f172a"/>
  <!-- Engine -->
  <rect x="250" y="240" width="85" height="75" rx="6" fill="url(#red)"/>
  <circle cx="280" cy="275" r="16" fill="#334155"/>
  <!-- Triplex Plunger Pump -->
  <rect x="330" y="260" width="45" height="50" rx="4" fill="#94a3b8"/>
  <circle cx="375" cy="285" r="6" fill="#f59e0b"/>
  <!-- Hose Reel & Hose -->
  <circle cx="340" cy="180" r="22" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/>
  <path d="M375 285 C420 300, 440 250, 420 200 L440 160" stroke="#0f172a" stroke-width="6" fill="none"/>
  <!-- Spray Wand -->
  <line x1="420" y1="210" x2="470" y2="130" stroke="#cbd5e1" stroke-width="5"/>
  <rect x="420" y="195" width="20" height="20" rx="3" fill="#ef4444"/>
  <!-- Title -->
  <text x="50" y="60" fill="#f8fafc" font-size="20" font-family="system-ui, sans-serif" font-weight="700">Simpson 4400 PSI Pressure Washer</text>
  <text x="50" y="85" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">Commercial Gas Powered • AAA Triplex Pump</text>
</svg>
