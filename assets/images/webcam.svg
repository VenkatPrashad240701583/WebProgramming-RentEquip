<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="camLens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="#f8fafc"/>

  <!-- HD Webcam Body and Monitor Mount -->
  <g transform="translate(190, 110)">
    <!-- Base Monitor Clamp -->
    <rect x="70" y="140" width="80" height="20" rx="4" fill="#334155"/>
    <path d="M90 160 L90 200 L130 200" stroke="#1e293b" stroke-width="8" stroke-linecap="round" fill="none"/>
    <rect x="100" y="115" width="20" height="30" rx="4" fill="#475569"/>

    <!-- Wide Camera Barrel -->
    <rect x="0" y="50" width="220" height="70" rx="35" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    
    <!-- Stereo Mic Grills on sides -->
    <circle cx="35" cy="85" r="3" fill="#64748b"/>
    <circle cx="45" cy="85" r="3" fill="#64748b"/>
    <circle cx="175" cy="85" r="3" fill="#64748b"/>
    <circle cx="185" cy="85" r="3" fill="#64748b"/>

    <!-- Center Lens Assembly -->
    <circle cx="110" cy="85" r="30" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="110" cy="85" r="22" fill="url(#camLens)"/>
    <circle cx="104" cy="79" r="6" fill="#ffffff" opacity="0.8"/>

    <!-- Activity Blue LED -->
    <circle cx="75" cy="85" r="3" fill="#38bdf8"/>
  </g>

  <text x="48" y="44" fill="#0f172a" font-size="16" font-family="system-ui, sans-serif" font-weight="800">1080p FULL HD WEBCAM</text>
  <text x="320" y="44" fill="#0284c7" font-size="12" font-family="system-ui, sans-serif">Auto-Focus + Stereo Dual Microphones</text>
</svg>
