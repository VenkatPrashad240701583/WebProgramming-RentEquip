<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pbMatte" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="#f8fafc"/>

  <!-- 20,000mAh Fast Charging Power Bank Unit -->
  <g transform="translate(190, 80)">
    <!-- Rectangular Anodized Aluminum Shell -->
    <rect x="0" y="0" width="150" height="250" rx="16" fill="url(#pbMatte)" stroke="#0f172a" stroke-width="3"/>

    <!-- Front Face Capacity Logo -->
    <text x="75" y="140" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#64748b" text-anchor="middle">20000</text>
    <text x="75" y="158" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">mAh • 22.5W FAST CHARGE</text>

    <!-- 4 LED Battery Level Indicators (Glowing Green/Blue) -->
    <circle cx="54" cy="50" r="3.5" fill="#22c55e"/>
    <circle cx="68" cy="50" r="3.5" fill="#22c55e"/>
    <circle cx="82" cy="50" r="3.5" fill="#22c55e"/>
    <circle cx="96" cy="50" r="3.5" fill="#22c55e"/>

    <!-- Top Port Panel (USB-C In/Out, 2x USB-A Out) -->
    <rect x="15" y="-5" width="120" height="8" rx="2" fill="#0f172a"/>
    <rect x="30" y="-3" width="22" height="4" rx="1" fill="#f59e0b"/>
    <rect x="65" y="-3" width="18" height="4" rx="2" fill="#38bdf8"/>
    <rect x="98" y="-3" width="22" height="4" rx="1" fill="#f59e0b"/>
  </g>

  <!-- Braided Nylon Multi-head Cable (Lightning, Type-C, Micro-USB) -->
  <g transform="translate(360, 160)">
    <path d="M-90 -70 C-50 -20, 20 40, 40 100" stroke="#f59e0b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="30" y="95" width="22" height="35" rx="4" fill="#0f172a"/>
    <rect x="36" y="130" width="10" height="15" rx="2" fill="#cbd5e1"/>
  </g>

  <text x="48" y="44" fill="#0f172a" font-size="16" font-family="system-ui, sans-serif" font-weight="800">20,000mAh FAST POWER BANK</text>
  <text x="340" y="44" fill="#0284c7" font-size="12" font-family="system-ui, sans-serif">Type-C PD + Dual USB + All-in-One Cable</text>
</svg>
