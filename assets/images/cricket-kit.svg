<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="willowWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="leatherRed" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="#fefce8"/>

  <!-- English Willow Cricket Bat -->
  <g transform="translate(180, 50) rotate(18)">
    <!-- Cane Handle with Chevron Grip -->
    <rect x="35" y="0" width="16" height="85" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M35 15 L43 22 L51 15 M35 30 L43 37 L51 30 M35 45 L43 52 L51 45 M35 60 L43 67 L51 60" stroke="#ef4444" stroke-width="1.5" fill="none"/>

    <!-- Bat Blade Shoulder and Body -->
    <path d="M30 85 L20 120 L20 280 Q43 290 66 280 L66 120 L56 85 Z" fill="url(#willowWood)" stroke="#d97706" stroke-width="2"/>
    <!-- Bat Spine Ridge -->
    <line x1="43" y1="120" x2="43" y2="280" stroke="#d97706" stroke-width="2"/>
    <!-- Red Brand Sticker on Bat Face -->
    <rect x="26" y="140" width="34" height="60" rx="4" fill="#dc2626"/>
    <text x="43" y="175" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">SG</text>
  </g>

  <!-- Red Leather Cricket Match Ball -->
  <g transform="translate(360, 200)">
    <circle cx="45" cy="45" r="38" fill="url(#leatherRed)" stroke="#991b1b" stroke-width="2"/>
    <!-- White Hand-Stitched Seam -->
    <path d="M12 25 C45 60, 45 60, 78 65" stroke="#ffffff" stroke-width="3" stroke-dasharray="3 2" fill="none"/>
    <path d="M14 27 C47 62, 47 62, 80 67" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2" fill="none"/>
  </g>

  <!-- Wooden Bails & Stumps Base hint -->
  <g transform="translate(100, 250)">
    <rect x="0" y="0" width="12" height="70" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <rect x="20" y="0" width="12" height="70" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <rect x="40" y="0" width="12" height="70" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <!-- Bail on top -->
    <rect x="-4" y="-8" width="60" height="8" rx="2" fill="#d97706"/>
  </g>

  <text x="48" y="44" fill="#854d0e" font-size="16" font-family="system-ui, sans-serif" font-weight="800">COLLEGE CRICKET KIT</text>
  <text x="320" y="44" fill="#ca8a04" font-size="12" font-family="system-ui, sans-serif">English Willow Bat + Leather Match Ball + Bails</text>
</svg>
