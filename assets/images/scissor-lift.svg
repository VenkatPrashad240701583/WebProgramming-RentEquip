<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="0" y="340" width="600" height="60" fill="#090d16"/>
  <!-- Chassis Base -->
  <rect x="210" y="280" width="180" height="45" rx="6" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <!-- Wheels -->
  <circle cx="245" cy="325" r="24" fill="#0f172a" stroke="#475569" stroke-width="6"/>
  <circle cx="245" cy="325" r="10" fill="#cbd5e1"/>
  <circle cx="355" cy="325" r="24" fill="#0f172a" stroke="#475569" stroke-width="6"/>
  <circle cx="355" cy="325" r="10" fill="#cbd5e1"/>
  <!-- Scissor Mechanism (X arms) -->
  <!-- Level 1 -->
  <line x1="230" y1="280" x2="370" y2="230" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <line x1="370" y1="280" x2="230" y2="230" stroke="#d97706" stroke-width="12" stroke-linecap="round"/>
  <circle cx="300" cy="255" r="6" fill="#0f172a"/>
  <!-- Level 2 -->
  <line x1="230" y1="230" x2="370" y2="180" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <line x1="370" y1="230" x2="230" y2="180" stroke="#d97706" stroke-width="12" stroke-linecap="round"/>
  <circle cx="300" cy="205" r="6" fill="#0f172a"/>
  <!-- Level 3 -->
  <line x1="230" y1="180" x2="370" y2="130" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <line x1="370" y1="180" x2="230" y2="130" stroke="#d97706" stroke-width="12" stroke-linecap="round"/>
  <circle cx="300" cy="155" r="6" fill="#0f172a"/>
  <!-- Hydraulic Cylinder center -->
  <line x1="300" y1="255" x2="300" y2="155" stroke="#94a3b8" stroke-width="6"/>
  <!-- Work Platform / Cage -->
  <rect x="200" y="110" width="200" height="20" fill="#334155"/>
  <rect x="200" y="60" width="200" height="50" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <line x1="250" y1="60" x2="250" y2="110" stroke="#f59e0b" stroke-width="3"/>
  <line x1="300" y1="60" x2="300" y2="110" stroke="#f59e0b" stroke-width="3"/>
  <line x1="350" y1="60" x2="350" y2="110" stroke="#f59e0b" stroke-width="3"/>
  <!-- Control Box -->
  <rect x="375" y="70" width="16" height="25" fill="#ef4444" rx="2"/>
  <text x="50" y="60" fill="#f8fafc" font-size="20" font-family="system-ui, sans-serif" font-weight="700">Genie GS-1930</text>
  <text x="50" y="85" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif">19ft Electric Scissor Lift • Zero Emissions</text>
</svg>
